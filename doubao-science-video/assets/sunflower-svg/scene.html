<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>向日而生 · SVG 萌发实验室</title>
<style>

 <clipPath id="soilClip"><rect x="90" y="354" width="770" height="230" rx="18"/></clipPath>
</defs>
<rect width="1280" height="720" fill="#f7f5ec"/>
<text x="64" y="50" font-size="13" letter-spacing="4" fill="#72816b">BOTANICAL LAB / 植物观察室</text>
<text id="title" x="64" y="103" font-size="36" font-weight="600">先扎根，再向上生长</text>
<text x="64" y="136" font-size="16" fill="#78816d">向日葵 · 萌发过程示意</text>
<rect x="1042" y="47" width="174" height="32" rx="16" fill="#e8edda"/><text x="1129" y="68" text-anchor="middle" font-size="13">SVG 程序动画 · 01</text>
<circle cx="470" cy="315" r="222" fill="#eef0dc" opacity=".55"/>
<path d="M92 354H860" stroke="#9c9876" stroke-width="2"/>
<text x="108" y="341" font-size="13" fill="#928b6d">土面</text>
<rect x="90" y="355" width="770" height="229" rx="18" fill="url(#soil)"/>
<rect x="90" y="355" width="770" height="229" rx="18" fill="url(#grains)"/>
<g id="rootSystem" clip-path="url(#soilClip)" fill="none" stroke-linecap="round">
 <path id="root" d="M470 435 C460 457 478 486 465 510 S458 545 472 570" stroke="#8e7552" stroke-width="9"/>

 </g>
 <g id="hairs" stroke="#b49b73" stroke-width="1.5"><path d="M417 502l-16 -1m18 -5l-8 -10m113 17l12 -6m-5 13l15 -1m-119 31l-13 1m17 6l-9 10m91 0l14 -5m-7 12l15 1"/></g>
</g>
<g id="shoot" fill="none"><path id="stem" stroke="#648846" stroke-width="13" stroke-linecap="round"/></g>
<g id="seed" transform="translate(470 322)">
 <g id="shellLeft"><path d="M0 -65 C-56 -47 -48 27 0 50Z" fill="url(#shell)" stroke="#8d8d73" stroke-width="2"/><path d="M-7 -52Q-35 -12 -4 37" stroke="#d1c6a3" stroke-width="4" opacity=".8" fill="none"/></g>
 <g id="shellRight"><path d="M0 -65 C56 -47 48 27 0 50Z" fill="url(#shell)" stroke="#8d8d73" stroke-width="2"/><path d="M9 -49Q32 -11 5 35" stroke="#c6bc9c" stroke-width="3" opacity=".7" fill="none"/></g>
 <g id="embryo"><ellipse cx="-9" cy="-8" rx="13" ry="36" fill="#e9dfae"/><ellipse cx="10" cy="-8" rx="13" ry="36" fill="#f7edc1"/><path d="M0 8Q-8 29 0 42" fill="none" stroke="#c2b47d" stroke-width="5"/></g>
</g>
<g id="cotyledons" transform="translate(470 230)">
 <path id="leftLeaf" d="M0 0 C-25 -48 -107 -57 -124 -31 C-128 -1 -52 24 0 0Z" fill="url(#leaf)" stroke="#5f843f" stroke-width="2"/>
 <path id="rightLeaf" d="M0 0 C25 -48 107 -57 124 -31 C128 -1 52 24 0 0Z" fill="url(#leaf)" stroke="#5f843f" stroke-width="2"/>
 <g stroke="#6f974a" fill="none" stroke-width="1.8"><path d="M0 0Q-56 -28 -112 -30M0 0Q56 -28 112 -30"/><path d="M-39 -13l-16 -20m-8 13l-13 11m115 -4l16 -20m8 13l13 11"/></g>
</g>
<g id="rootLabel"><path d="M537 521H650l34 -20" fill="none" stroke="#a08b66"/><circle cx="537" cy="521" r="4" fill="#a08b66"/><text x="690" y="500" font-size="18" fill="#77684c">主根与侧根</text><text x="690" y="524" font-size="13" fill="#998966">吸收水和无机盐</text></g>
<g id="leafLabel"><path d="M595 211H657l27 -22" fill="none" stroke="#82925c"/><circle cx="595" cy="211" r="4" fill="#82925c"/><text x="690" y="192" font-size="18">两片子叶</text><text x="690" y="216" font-size="13" fill="#798768">先供应储藏的养分</text></g>
<path d="M915 180V568" stroke="#dedfce"/>
<text x="960" y="206" font-size="12" fill="#8c947c" letter-spacing="3">OBSERVATION</text>
<text id="phase" x="960" y="251" font-size="27" font-weight="600">01 / 胚根先伸出</text>
<text id="note1" x="960" y="298" font-size="17" fill="#65755d">先向下，建立根系。</text>
<text id="note2" x="960" y="330" font-size="17" fill="#65755d">再向上，迎接阳光。</text>
<g transform="translate(960 390)"><circle cx="18" cy="18" r="18" fill="#e7edda"/><path d="M18 7v20m-7 -8l7 8 7 -8" fill="none" stroke="#7b9653" stroke-width="2"/><text x="51" y="24" font-size="16" fill="#758265">生长有顺序</text></g>
<text x="960" y="500" font-size="14" fill="#8f967f">时间已压缩 · 比例为示意</text>
<rect id="summaryBand" x="64" y="616" width="1152" height="58" rx="16" fill="#e8eddc"/>
<text id="summary" x="88" y="652" font-size="20">把根扎稳，是幼苗迈出的第一步。</text>
<text x="64" y="701" font-size="12" fill="#7d876d">AI 辅助编写示意动画 · 配音由 AI 生成</text>
<text x="1216" y="701" text-anchor="end" font-size="12" fill="#7d876d">SUNFLOWER / 萌发小样</text>
</svg></div>
<div id="controls"><button id="play">播放</button><input id="time" aria-label="生长时间" type="range" min="0" max="20.55" step="0.01" value="0"><span id="clock">0.0s</span><button id="explode">拆开看种子</button></div>
<script>
const $=id=>document.getElementById(id), clamp=x=>Math.min(1,Math.max(0,x)), smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
window.animationDuration=20.55;let exploded=false,playing=false,t=0,last=0;
const paths=[$('root'),...$('laterals').querySelectorAll('path')];
paths.forEach(p=>{const l=p.getTotalLength();p.dataset.len=l;p.style.strokeDasharray=l;});
window.renderFrame=function(seconds){
 t=Math.max(0,Math.min(window.animationDuration,seconds));
 const root=smooth((t-.8)/4.7),branches=smooth((t-4.6)/4),up=smooth((t-10.6)/4),leaves=smooth((t-13.6)/3.5),split=exploded?1:0;
 paths.forEach((p,i)=>p.style.strokeDashoffset=p.dataset.len*(1-(i?branches:root)));
 $('hairs').style.opacity=branches;
 $('rootLabel').style.opacity=smooth((t-6)/2);
 const tipY=405-191*up;
 $('seed').setAttribute('transform',`translate(470 ${405-183*up}) scale(${.65-.05*up})`);
 $('seed').style.opacity=1-smooth((t-14.4)/2.6);
 $('shellLeft').setAttribute('transform',`translate(${-52*split} 0) rotate(${-18*split})`);
 $('shellRight').setAttribute('transform',`translate(${52*split} 0) rotate(${18*split})`);
 $('embryo').style.opacity=split;
 $('stem').style.opacity=up;
 $('stem').setAttribute('d',`M470 435 C${470-24*Math.sin(up*Math.PI)} ${427-70*up} ${448-34*Math.sin(up*Math.PI)} ${414-228*up} 470 ${tipY}`);
 $('cotyledons').style.opacity=leaves;
 $('cotyledons').setAttribute('transform',`translate(470 ${tipY}) scale(${Math.max(.01,leaves)})`);
 $('leafLabel').style.opacity=smooth((t-16.8)/2);
 $('phase').textContent=t<10.48?'01 / 胚根先伸出':'02 / 子叶出土';
 $('summary').textContent=t<10.48?'把根扎稳，是幼苗迈出的第一步。':'两片子叶展开变绿后，也能参与光合作用。';
 $('time').value=t;$('clock').textContent=t.toFixed(1)+'s';
};
$('time').oninput=e=>{playing=false;$('play').textContent='播放';renderFrame(+e.target.value)};
$('explode').onclick=()=>{exploded=!exploded;$('explode').textContent=exploded?'组装种子':'拆开看种子';renderFrame(t)};
$('play').onclick=()=>{playing=!playing;if(t>=animationDuration)t=0;last=performance.now();$('play').textContent=playing?'暂停':'播放'};
if(new URLSearchParams(location.search).has('export')){document.body.classList.add('export')}else{
 function tick(now){if(playing){t+=(now-last)/1000;if(t>=animationDuration){t=animationDuration;playing=false;$('play').textContent='播放'}renderFrame(t)}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
}
renderFrame(0);
</script></html>
